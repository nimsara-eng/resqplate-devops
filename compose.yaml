
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.container
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - resqplate-network

  mongodb:
    image: mongo:8
    env_file:
      - ./backend/.env.mongo
    volumes:
      - resqplate-mongo-data:/data/db
    networks:
      resqplate-network:
        aliases:
          - resqplate-mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  resqplate-mongo-data:
    external: true

networks:
  resqplate-network:
    external: true
